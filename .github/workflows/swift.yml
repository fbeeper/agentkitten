# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift
# Xcode version info: https://raw.githubusercontent.com/actions/runner-images/main/images/macos/macos-26-Readme.md

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-macos:
    name: Lint & Build & Test (macOS, Xcode ${{ matrix.xcode }}, Swift 6.3)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.4.1"]
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Setup
      run: make setup
    - name: Lint
      run: make lint
    - name: Build
      run: make build
    - name: Test
      run: make test

  test-macos-swift6_2:
    name: Build & Test (macOS, Xcode ${{ matrix.xcode }}, Swift 6.2)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.0.1"]
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: make build
    - name: Test
      run: make test

  build-swift6_1:
    name: Build (macOS, Xcode ${{ matrix.xcode }}, Swift 6.1)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.3"]
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: make build
    - name: Test
      run: make test

  build-platforms:
    name: Build (${{ matrix.platform.name }}, Xcode ${{ matrix.xcode }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.4.1"]
        platform:
          - { name: "iOS",         destination: "generic/platform=iOS" }
          - { name: "tvOS",        destination: "generic/platform=tvOS" }
          - { name: "watchOS",     destination: "generic/platform=watchOS" }
          - { name: "visionOS",    destination: "generic/platform=visionOS" }
          - { name: "macCatalyst", destination: "platform=macOS,variant=Mac Catalyst" }
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Build ${{ matrix.platform.name }}
      run: make xcodebuild-for-platform PLATFORM=${{ matrix.platform.name }}

  build-linux:
    name: Experimental Build & Test (Linux, Swift 6.3)
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
    - uses: actions/checkout@v6
    - name: Show versions
      run: swift --version
    - name: Build
      run: swift build -Xswiftc -warnings-as-errors
    - name: Test
      run: swift test -Xswiftc -warnings-as-errors

  build-android:
    name: Experimental Build (Android, Swift 6.3)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_TRIPLE: aarch64-unknown-linux-android28
    steps:
    - uses: actions/checkout@main
    - uses: orchetect/setup-swift-android-sdk@v1
      with:
        target-triple: ${{ env.TARGET_TRIPLE }}
    - name: Build
      run: swift build --swift-sdk "$TARGET_TRIPLE"
      
  build-wasm:
    name: Experimental Build & Test (WASM, Swift 6.3)
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
    - uses: actions/checkout@v6
    - name: Show versions
      run: swift --version
    - name: Intall WASM SDK
      run: swift sdk install https://download.swift.org/swift-6.3.2-release/wasm-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz --checksum a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
    - name: Build
      run: swift build --swift-sdk swift-6.3.2-RELEASE_wasm -Xswiftc -warnings-as-errors
    - name: Test
      run: swift test --swift-sdk swift-6.3.2-RELEASE_wasm -Xswiftc -warnings-as-errors
