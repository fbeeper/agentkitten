# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift
# Xcode version info: https://raw.githubusercontent.com/actions/runner-images/main/images/macos/macos-26-Readme.md

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-macos:
    name: Test (macOS, Xcode ${{ matrix.xcode }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.4.1"]
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Setup
      run: make setup
    - name: Lint
      run: make lint
    - name: Build
      run: make build
    - name: Test
      run: make test

  test-macos-swift6_2:
    name: Test (macOS, Xcode ${{ matrix.xcode }}, Swift 6.2)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.0.1"]
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: make build
    - name: Test
      run: make test

  build-swift6_1:
    name: Build (macOS, Xcode ${{ matrix.xcode }}, Swift 6.1)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.3"]
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: make build

  build-platforms:
    name: Build (${{ matrix.platform.name }}, Xcode ${{ matrix.xcode }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.4.1"]
        platform:
          - { name: "iOS",         destination: "generic/platform=iOS" }
          - { name: "tvOS",        destination: "generic/platform=tvOS" }
          - { name: "watchOS",     destination: "generic/platform=watchOS" }
          - { name: "visionOS",    destination: "generic/platform=visionOS" }
          - { name: "macCatalyst", destination: "platform=macOS,variant=Mac Catalyst" }
    steps:
    - uses: actions/checkout@v6
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
    - name: Build ${{ matrix.platform.name }}
      run: make xcodebuild-for-platform PLATFORM=${{ matrix.platform.name }}
